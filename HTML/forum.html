<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forum | Kiss Balint Skotdudas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #ebdbc9; color: #1f1f1f; }
    .navbar { align-items: end; }
    .navbar-nav { display: flex; gap: 2rem; }
    .forum-hero { background-image: linear-gradient(rgba(0,106,81,.62), rgba(0,106,81,.82)), url('tartan_custom.png'); background-size: cover; color: #ebdbc9; padding: 5rem 1rem; }
    .forum-title { font-family: 'IM Fell DW Pica SC', serif; font-size: clamp(2.4rem, 6vw, 5rem); }
    .forum-shell { padding: 3rem 1rem; }
    .forum-panel, .forum-post { background: #ffffff; border-radius: 8px; padding: 1.5rem; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .forum-post { margin-bottom: 1rem; }
    .forum-post h2 { font-family: 'IM Fell DW Pica SC', serif; color: #006a51; font-size: 1.8rem; }
    .forum-post-meta { color: #006a51; font-size: .9rem; font-weight: 600; margin-bottom: .5rem; }
    .btn-custom { background-color: #006a51; color: #ffffff; border: none; border-radius: 8px; }
    .btn-custom:hover { background-color: #00513e; color: #ffffff; }
    .footer { background-color: #006a51; color: white; }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow" style="--bs-bg-opacity: .76; border-radius: 0 0 18px 18px;">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="logodudabalint3.png" alt="Kiss Balint" height="70"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Kezdolap</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="forum.html">Forum</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Bejelentkezes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="forum-hero">
    <div class="container">
      <h1 class="forum-title">Forum</h1>
      <p class="lead mb-0">Beszelgetesek a skot duda tanulasarol, fellepesekrol es kerdesekrol.</p>
    </div>
  </header>

  <main class="forum-shell container">
    <div id="forumStatus" class="alert alert-secondary">Betoltes...</div>

    <form id="forumPostForm" class="forum-panel vstack gap-3 mb-4" hidden>
      <h2 class="h4 mb-0">Uj beszelgetes</h2>
      <div class="form-floating">
        <input type="text" class="form-control" id="postTitle" maxlength="120" placeholder="Cim" required>
        <label for="postTitle">Cim</label>
      </div>
      <div class="form-floating">
        <textarea class="form-control" id="postBody" placeholder="Uzenet" style="height: 150px" required></textarea>
        <label for="postBody">Uzenet</label>
      </div>
      <button type="submit" class="btn btn-custom align-self-start">Kuldes</button>
    </form>

    <section id="forumPosts" aria-live="polite"></section>
  </main>

  <footer class="footer py-4">
    <div class="container text-center">
      <p class="mb-0">KISS BALINT SKOTDUDAS 2025</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/site-feedback.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script type="module" src="assets/js/forum.js"></script>
</body>

</html>
