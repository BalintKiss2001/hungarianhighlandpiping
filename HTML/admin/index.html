<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tartalomkezelő | Kiss Bálint Skótdudás</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ebdbc9;
        color: #1f1f1f;
      }

      .admin-loading {
        width: min(100% - 2rem, 560px);
        background: #ffffff;
        border-radius: 8px;
        padding: 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
      }

      .admin-loading h1 {
        margin-top: 0;
        color: #006a51;
      }
    </style>
  </head>
  <body>
    <div class="admin-loading" id="adminStatus">
      <h1>Tartalomkezelő</h1>
      <p>Admin fiók ellenőrzése...</p>
    </div>

    <script src="../assets/js/supabase-config.js"></script>
    <script type="module">
      import { isSupabaseConfigured, supabase } from "../assets/js/supabase-client.js";

      const status = document.getElementById("adminStatus");
      const adminEmails = (window.HHP_ADMIN_EMAILS || [])
        .map((email) => email.toLowerCase().trim());

      function showMessage(title, text) {
        status.innerHTML = `<h1>${title}</h1><p>${text}</p>`;
      }

      function loadCms() {
        status.remove();
        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js";
        document.body.appendChild(script);
      }

      if (!isSupabaseConfigured) {
        showMessage("Admin ellenőrzés sikertelen", "A Supabase beállítás hiányzik.");
      } else {
        const { data } = await supabase.auth.getUser();
        const email = data.user?.email?.toLowerCase().trim();

        if (!data.user) {
          window.location.href = "../login.html";
        } else if (!adminEmails.includes(email)) {
          showMessage("Nincs admin jogosultság", "Ezzel a fiókkal nem érhető el a tartalomkezelő.");
          setTimeout(() => {
            window.location.href = "../index.html";
          }, 2500);
        } else {
          loadCms();
        }
      }
    </script>
  </body>
</html>
