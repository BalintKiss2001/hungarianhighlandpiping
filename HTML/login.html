<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bejelentkezes | Kiss Balint Skotdudas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica+SC&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #ebdbc9; color: #1f1f1f; min-height: 100vh; }
    .navbar { align-items: end; }
    .navbar-nav { display: flex; gap: 2rem; }
    .auth-wrap { min-height: calc(100vh - 96px); display: grid; place-items: center; padding: 3rem 1rem; }
    .auth-panel { width: min(100%, 520px); background: #ffffff; border-radius: 8px; padding: clamp(1.5rem, 4vw, 2.5rem); box-shadow: 0 5px 18px rgba(0,0,0,.14); }
    .auth-title { font-family: 'IM Fell DW Pica SC', serif; color: #006a51; font-size: clamp(2rem, 5vw, 3rem); }
    .btn-custom { background-color: #006a51; color: #ffffff; border: none; border-radius: 8px; }
    .btn-custom:hover { background-color: #00513e; color: #ffffff; }
    .footer { background-color: #006a51; color: white; }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow" style="--bs-bg-opacity: .76; border-radius: 0 0 18px 18px;">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="logodudabalint3.png" alt="Kiss Balint" height="70"></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Kezdolap</a></li>
          <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="forum.html">Forum</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="login.html">Bejelentkezes</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="auth-wrap">
    <section class="auth-panel">
      <h1 class="auth-title mb-3">Bejelentkezes</h1>
      <p id="userEmail" class="text-success fw-semibold"></p>
      <div id="authStatus" class="alert alert-secondary">Betoltes...</div>

      <form id="authForm" class="vstack gap-3">
        <div class="form-floating">
          <input type="email" class="form-control" id="email" placeholder="Email" required>
          <label for="email">Email</label>
        </div>
        <div class="form-floating">
          <input type="password" class="form-control" id="password" placeholder="Jelszo" minlength="6" required>
          <label for="password">Jelszo</label>
        </div>
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-custom" type="button" id="signInButton">Bejelentkezes</button>
          <button class="btn btn-outline-success" type="button" id="signUpButton">Fiok letrehozasa</button>
        </div>
      </form>

      <button class="btn btn-outline-danger mt-3" type="button" id="signOutButton" hidden>Kijelentkezes</button>
    </section>
  </main>

  <footer class="footer py-4">
    <div class="container text-center">
      <p class="mb-0">KISS BALINT SKOTDUDAS 2025</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
</body>

</html>
